steps:
  # ステップ1: Dockerイメージをビルド
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/react-history-js:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/react-history-js:latest"
      - "."

  # ステップ2: イメージをContainer Registryにプッシュ
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/react-history-js:$SHORT_SHA"

  # ステップ3: Cloud Runにデプロイ
  - name: "gcr.io/cloud-builders/gke-deploy"
    args:
      - "run"
      - "--filename=."
      - "--image=gcr.io/$PROJECT_ID/react-history-js:$SHORT_SHA"
      - "--location=us-central1"
      - "--output=/workspace/output"

images:
  - "gcr.io/$PROJECT_ID/react-history-js:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/react-history-js:latest"

# ビルドタイムアウト（デフォルト10分）
timeout: "1800s"

# ログを Cloud Logging に保存
logsBucket: "gs://$PROJECT_ID_cloudbuild"
